<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APIKey 探测</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="app" class="page">
    <section class="card hero" aria-labelledby="pageTitle">
      <h1 id="pageTitle">获取本机 AI Agent 工具 APIKey</h1>
      <div class="hero-actions">
        <button id="scanBtn" class="btn btn-primary" type="button" disabled>
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>重新扫描</span>
        </button>
        <span id="noAgentTip" class="chip chip-warning" hidden>请先在顶部选择设备</span>
      </div>
    </section>

    <section id="errorCard" class="card card-error" hidden aria-live="polite">
      <p id="errorText" class="error-text"></p>
    </section>

    <div id="runningBar" class="running" hidden role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>扫描中…</span>
    </div>

    <section id="resultCard" class="card result-card" hidden aria-labelledby="resultTitle">
      <div class="result-head">
        <h2 id="resultTitle">扫描结果</h2>
        <span id="countChip" class="chip chip-secondary"></span>
      </div>
      <p id="emptyText" class="empty" hidden>未发现 AI 软件 API Key。</p>
      <div id="groups" class="accordion" hidden></div>
    </section>
  </div>

  <script src="_bridge.js"></script>
  <script src="index.js"></script>
</body>
</html>
